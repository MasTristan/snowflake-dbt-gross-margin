name: 'ae_tpf_project'
version: '1.0.0'
require-dbt-version: [">=1.11.0", "<1.12.0"]

profile: 'ae_tpf_project'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  lookback_days: 3

models:
  ae_tpf_project:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts
