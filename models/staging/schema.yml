version: 2

models:
  - name: stg_lineitem
    description: "Cleaned line items, one row per order line."
    columns:
      - name: order_key
        description: "FK to orders."
        data_tests:
          - not_null
      - name: line_number
        description: "Line number within an order."
        data_tests:
          - not_null

  - name: stg_orders
    description: "Cleaned orders."
    columns:
      - name: order_key
        description: "Primary key."
        data_tests:
          - unique
          - not_null
      - name: order_status
        description: "Order status code."
        data_tests:
          - accepted_values:
              arguments:
                values: ['O', 'F', 'P']

  - name: stg_customer
    description: "Cleaned customers."
    columns:
      - name: customer_key
        description: "Primary key."
        data_tests:
          - unique
          - not_null

  - name: stg_part
    description: "Cleaned parts."
    columns:
      - name: part_key
        description: "Primary key."
        data_tests:
          - unique
          - not_null

  - name: stg_partsupp
    description: "Part/supplier costs, composite key (part_key, supplier_key). Feeds gross_cost in fct_sales. Composite uniqueness is enforced by tests/assert_unique_partsupp_grain.sql."
    columns:
      - name: part_key
        description: "FK to part, part of the composite key."
        data_tests:
          - not_null
      - name: supplier_key
        description: "FK to supplier, part of the composite key."
        data_tests:
          - not_null
      - name: supply_cost
        description: "Unit supply cost, drives gross_cost and gross_margin."
        data_tests:
          - not_null

  - name: stg_nation
    description: "Nation joined to its region. Feeds geography in dim_customer."
    columns:
      - name: nation_key
        description: "Primary key."
        data_tests:
          - unique
          - not_null
